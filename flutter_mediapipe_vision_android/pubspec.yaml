name: flutter_mediapipe_vision_android
description: A minimal wrapper for the pose landmark detector
repository: https://github.com/alexeyinkin/flutter-mediapipe
version: 0.3.0
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.35.0'

dependencies:
  flutter: { sdk: flutter }
  flutter_web_plugins: { sdk: flutter }
  flutter_mediapipe_vision_platform_interface: ^0.3.0
  plugin_platform_interface: ^2.0.2

flutter:
  plugin:
    platforms:
      android:
        package: com.ainkin.flutter_mediapipe_vision
        pluginClass: FlutterMediapipeVisionPlugin
